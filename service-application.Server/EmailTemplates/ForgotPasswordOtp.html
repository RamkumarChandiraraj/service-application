<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Password Reset OTP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f5f7;
            padding: 20px;
        }
        .card {
            max-width: 520px;
            margin: auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
        }
        .otp {
            font-size: 28px;
            font-weight: bold;
            color: #124265;
            letter-spacing: 4px;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Hello {{UserName}},</h2>

        <p>You requested to reset your password.</p>

        <p>Your OTP:</p>

        <p class="otp">{{OTP}}</p>

        <p>This OTP is valid for <b>5 minutes</b>.</p>

        <div class="footer">
            <p>If you didn’t request this, ignore this email.</p>
            <p>– Support Team</p>
        </div>
    </div>
</body>
</html>
